version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing deployment and testing dependencies..."
      - pip install --upgrade pip setuptools wheel
      - pip install uv
      - if [ -f "requirements.txt" ]; then uv pip install --system -r requirements.txt; fi
      - uv pip install --system bandit pytest pytest-cov

  pre_build:
    commands:
      - echo "Running targeted security scan on production files..."
      # Excludes tests folder and ignores assert checks (B101) inside evaluation tools
      - python -m bandit -r . -x ./tests,./venv,.git -sk B101
      - echo "Starting database mock infrastructure..."
      # Spins up an isolated database runner so pytest can complete successfully
      - docker run --name test-postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=python_fastapi_db -p 5432:5432 -d postgres:15-alpine
      - sleep 5

  build:
    commands:
      - echo "Executing validation testing suite..."
      - python -m pytest tests/

  post_build:
    commands:
      - echo "Build finished on $(date)"

artifacts:
  files:
    - '**/*'
