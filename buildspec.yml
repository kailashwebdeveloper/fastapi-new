version: 0.2

env:
  variables:
    PYTHON_VERSION: "3.11"
    APP_DIR: "app"

phases:
  install:
    runtime-versions:
      python: $PYTHON_VERSION
    commands:
      - echo "Installing uv via pip to guarantee clean execution..."
      - pip install --upgrade pip setuptools wheel
      - pip install uv
      - echo "Upgrading package components inside uv..."
      - uv pip install --system --upgrade pip setuptools wheel
      - |
        if [ -f "requirements.txt" ]; then
          echo "Installing requirements via uv..."
          uv pip install --system -r requirements.txt
        elif [ -f "pyproject.toml" ]; then
          echo "Installing poetry dependencies via uv..."
          uv pip install --system poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi
        fi

  pre_build:
    commands:
      - echo "Installing testing and security tools..."
      - uv pip install --system bandit pytest pytest-cov
      - echo "Running security scan via python module..."
      - python -m bandit -r $APP_DIR -x tests/
      - echo "Verifying FastAPI environment..."
      - python -c "import fastapi; print('FastAPI Version:', fastapi.__version__)"

  build:
    commands:
      - echo "Executing unit tests via python module..."
      - python -m pytest --cov=$APP_DIR tests/ --cov-report=term-missing

  post_build:
    commands:
      - echo "Build finished on $(date)"
      - echo "Packaging production artifacts..."
      - mkdir -p build_output
      - cp -R $APP_DIR main.py requirements.txt build_output/ 2>/dev/null || cp -R . build_output/

artifacts:
  files:
    - '**/*'
  base-directory: 'build_output'
  discard-paths: no

cache:
  paths:
    - '/root/.cache/uv/**/*'
    - '/root/.cache/pip/**/*'
