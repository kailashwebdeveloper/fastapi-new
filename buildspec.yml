version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing uv via pip..."
      - pip install --upgrade pip setuptools wheel
      - pip install uv
      - echo "Installing requirements and testing tools..."
      - if [ -f "requirements.txt" ]; then uv pip install --system -r requirements.txt; fi
      - uv pip install --system bandit pytest pytest-cov

  pre_build:
    commands:
      - echo "Running security scan via explicit python execution..."
      - python -m bandit -r . -x tests/

  build:
    commands:
      - echo "Executing unit tests via explicit python execution..."
      - python -m pytest tests/ 2>/dev/null || echo "No tests folder found, skipping tests..."

  post_build:
    commands:
      - echo "Build finished on $(date)"

artifacts:
  files:
    - '**/*'
